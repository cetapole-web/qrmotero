<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPEM - Ficha de Emergencia Médica</title>
    <!-- Tailwind CSS para un diseño responsivo y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #06141f 0%, #03080d 100%);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 254, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card-red {
            background: rgba(45, 15, 20, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 99, 99, 0.3);
        }
        .neon-glow-red {
            box-shadow: 0 0 15px rgba(255, 75, 75, 0.4);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        .neon-glow-orange {
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Estilo Smartphone -->
    <div class="w-full max-w-md bg-[#020b14] rounded-[40px] border-[8px] border-[#0e2233] shadow-2xl overflow-hidden relative pb-8">
        
        <!-- Barra superior simulada -->
        <div class="bg-[#040e18] px-6 py-3 flex justify-between items-center text-xs text-slate-400 border-b border-slate-800/60">
            <span>4:22</span>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i>
            </div>
        </div>

        <!-- Encabezado SIPEM -->
        <div class="bg-gradient-to-r from-teal-600 to-emerald-600 py-3 px-6 text-center shadow-lg">
            <h1 class="text-white font-black tracking-widest text-lg uppercase drop-shadow">SIPEM</h1>
        </div>

        <!-- Cuerpo de la Interfaz -->
        <div class="p-5 space-y-4">
            
            <!-- Alerta de Emergencia Médica -->
            <div class="glass-card-red rounded-2xl p-3 flex items-center justify-center space-x-3 neon-glow-red">
                <div class="relative flex items-center justify-center">
                    <span class="absolute w-6 h-6 bg-red-500 rounded-full animate-ping opacity-75"></span>
                    <i class="fa-solid fa-triangle-exclamation text-red-400 text-xl relative z-10"></i>
                </div>
                <span class="text-red-200 font-bold tracking-wide uppercase text-sm">Emergencia Médica</span>
            </div>

            <!-- Perfil / Avatar Central -->
            <div class="flex flex-col items-center justify-center pt-1 pb-2">
                <div class="w-20 h-20 rounded-full p-1 bg-gradient-to-tr from-cyan-400 to-teal-500 neon-glow-cyan mb-2">
                    <div class="w-full h-full bg-[#081826] rounded-full flex items-center justify-center overflow-hidden">
                        <i class="fa-solid fa-user text-cyan-300 text-3xl"></i>
                    </div>
                </div>
                <h2 class="text-white text-xl font-bold tracking-wide">Cesar Poleo</h2>
            </div>

            <!-- Grid de Datos Principales (Apellido y Tipo de Sangre) -->
            <div class="grid grid-cols-2 gap-3">
                <!-- Apellido -->
                <div class="glass-card rounded-2xl p-3.5 flex flex-col justify-between">
                    <div class="flex items-center space-x-2 text-cyan-400 text-xs font-semibold uppercase mb-1">
                        <i class="fa-solid fa-user-tag"></i>
                        <span>Apellido</span>
                    </div>
                    <span class="text-white font-medium text-base truncate">Poleo</span>
                </div>

                <!-- Tipo de Sangre -->
                <div class="glass-card-red rounded-2xl p-3.5 flex flex-col justify-between">
                    <div class="flex items-center space-x-2 text-red-400 text-xs font-semibold uppercase mb-1">
                        <i class="fa-solid fa-droplet"></i>
                        <span>Tipo de Sangre</span>
                    </div>
                    <span class="text-white font-bold text-lg">A+ <span class="text-xs font-normal text-red-300">Factor RH</span></span>
                </div>
            </div>

            <!-- Grid de Alergias y Condiciones -->
            <div class="grid grid-cols-2 gap-3">
                <!-- Alergias -->
                <div class="glass-card rounded-2xl p-3.5 flex flex-col justify-between">
                    <div class="flex items-center space-x-2 text-amber-400 text-xs font-semibold uppercase mb-1">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span>Alergias</span>
                    </div>
                    <span class="text-white font-medium text-base truncate">Mada</span>
                </div>

                <!-- Condiciones -->
                <div class="glass-card rounded-2xl p-3.5 flex flex-col justify-between">
                    <div class="flex items-center space-x-2 text-blue-400 text-xs font-semibold uppercase mb-1">
                        <i class="fa-solid fa-hospital"></i>
                        <span>Condiciones</span>
                    </div>
                    <span class="text-white font-medium text-base truncate">Kajaja</span>
                </div>
            </div>

            <!-- Tarjeta de Vehículo con Estética de Auto -->
            <div class="glass-card rounded-2xl p-4 space-y-2 relative overflow-hidden">
                <div class="flex items-center justify-between text-cyan-400 text-xs font-semibold uppercase">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-motorcycle text-cyan-400"></i>
                        <span>Placa del Vehículo</span>
                    </div>
                    <span class="text-white font-mono bg-cyan-950/80 px-2 py-0.5 rounded border border-cyan-500/30 text-xs">Qtcnnsb123</span>
                </div>
                <!-- Línea decorativa visual simulando wireframe de vehículo -->
                <div class="py-2 flex items-center justify-center opacity-60">
                    <i class="fa-solid fa-car-side text-4xl text-cyan-300"></i>
                </div>
            </div>

            <!-- Código Restringido (Botón Alerta / Candado) -->
            <div class="bg-gradient-to-r from-amber-600 to-orange-500 rounded-2xl p-3.5 flex items-center justify-center space-x-3 neon-glow-orange cursor-pointer hover:opacity-95 transition">
                <i class="fa-solid fa-lock text-white text-base"></i>
                <span class="text-white font-bold tracking-wider text-sm uppercase">Código Restringido</span>
            </div>

            <!-- Botones de Contacto y Soporte -->
            <div class="space-y-2.5 pt-1">
                <!-- Llamar -->
                <button onclick="alert('Llamando a Ceanlyn...')" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 shadow-lg transition">
                    <i class="fa-solid fa-phone"></i>
                    <span>LLAMAR A CEANLYN</span>
                </button>

                <!-- Soporte WhatsApp -->
                <button onclick="alert('Abriendo Soporte WhatsApp...')" class="w-full bg-gradient-to-r from-emerald-700 to-teal-800 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 shadow-lg transition">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>SOPORTE WHATSAPP</span>
                </button>
            </div>

        </div>

        <!-- Barra de Navegación Inferior Estilo App Moderna -->
        <div class="absolute bottom-0 left-0 right-0 bg-[#040e18]/90 backdrop-blur-md border-t border-slate-800 py-2.5 px-6 flex justify-around items-center text-xs text-slate-400">
            <div class="flex flex-col items-center text-cyan-400 cursor-pointer">
                <i class="fa-solid fa-wrench text-base mb-0.5"></i>
                <span>Book Service</span>
            </div>
            <div class="flex flex-col items-center hover:text-white cursor-pointer">
                <i class="fa-solid fa-triangle-exclamation text-base mb-0.5"></i>
                <span>Report</span>
            </div>
            <div class="flex flex-col items-center hover:text-white cursor-pointer">
                <i class="fa-solid fa-file-lines text-base mb-0.5"></i>
                <span>Records</span>
            </div>
        </div>

    </div>

</body>
</html>
